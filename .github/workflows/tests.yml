name: Testes
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: >-
          python -m pip --isolated --disable-pip-version-check install --only-binary=:all: --index-url https://pypi.org/simple pip==26.2
      - run: >-
          python -m pip --isolated install --only-binary=:all: --index-url https://pypi.org/simple -r requirements-dev.txt
      - run: python run.py --prepare
      - run: python -m unittest test_monitor test_interface test_portable_excel test_security test_updater test_native_updater test_startup test_notifications test_favorite_notifications test_favorite_changes -v
      - run: node test_price.cjs
      - run: node test_locations.cjs
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: >-
          python -m pip --isolated --disable-pip-version-check install --only-binary=:all: --index-url https://pypi.org/simple pip==26.2
      - run: >-
          python -m pip --isolated install --only-binary=:all: --index-url https://pypi.org/simple -r requirements-web.txt
      - run: python -m unittest test_web -v
      - run: docker compose -f compose.web.yml config --quiet
        env:
          RADAR_DOMAIN: radar.example
      - run: docker build -f Dockerfile.web -t radar-web-test .
      - run: docker run -d --name radar-web-test -p 127.0.0.1:8080:8080 -e RADAR_WEB_ORIGIN=https://radar.example radar-web-test
      - run: curl --fail --retry 10 --retry-all-errors --retry-delay 2 -H 'Host:radar.example' http://127.0.0.1:8080/healthz
      - if: always()
        run: docker logs radar-web-test
      - if: always()
        run: docker rm -f radar-web-test
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: >-
          python -m pip --isolated --disable-pip-version-check install --only-binary=:all: --index-url https://pypi.org/simple pip==26.2 pip-audit==2.10.1
      - run: >-
          python -m pip_audit -r requirements-web.txt -r requirements-dev.txt
